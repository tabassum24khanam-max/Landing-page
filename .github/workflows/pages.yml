
# Publishes the landing page to GitHub Pages on every push to main.
#
# The page is plain HTML/CSS/JS, so there is nothing to build — the repository
# is uploaded as-is. `enablement: true` switches Pages on the first time this
# runs, so no manual setup is needed in repository settings.
#
# Note: GitHub Pages serves static files only. The signup form needs server.js,
# which Pages cannot run — see README for hosting that part.

name: Deploy landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
